<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Surgical History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
    <!-- Overlay -->
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <!-- Popup Container -->
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl">
            <!-- Header -->
            <div class="border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                <h3 class="text-xl font-semibold text-gray-800">Add Surgical History</h3>
                <button class="text-gray-400 hover:text-gray-500">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Form Content -->
            <div class="p-6">
                <form>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Left Column -->
                        <div>
                            <!-- Procedure Name -->
                            <div class="mb-4">
                                <label for="procedureName" class="block text-sm font-medium text-gray-700 mb-1">Procedure Name*</label>
                                <div class="relative">
                                    <input type="text" id="procedureName" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g. Appendectomy, Knee Replacement" required>
                                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                        <i class="fas fa-procedures text-gray-400"></i>
                                    </div>
                                </div>
                            </div>

                            <!-- CPT Code -->
                            <div class="mb-4">
                                <label for="cptCode" class="block text-sm font-medium text-gray-700 mb-1">CPT Code</label>
                                <div class="relative">
                                    <input type="text" id="cptCode" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Procedure code">
                                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                        <i class="fas fa-barcode text-gray-400"></i>
                                    </div>
                                </div>
                            </div>

                            <!-- Surgery Date -->
                            <div class="mb-4">
                                <label for="surgeryDate" class="block text-sm font-medium text-gray-700 mb-1">Date of Surgery*</label>
                                <div class="relative">
                                    <input type="date" id="surgeryDate" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                        <i class="fas fa-calendar-alt text-gray-400"></i>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column -->
                        <div>
                            <!-- Surgeon -->
                            <div class="mb-4">
                                <label for="surgeon" class="block text-sm font-medium text-gray-700 mb-1">Surgeon</label>
                                <input type="text" id="surgeon" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Surgeon's name">
                            </div>

                            <!-- Facility -->
                            <div class="mb-4">
                                <label for="facility" class="block text-sm font-medium text-gray-700 mb-1">Facility</label>
                                <input type="text" id="facility" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Hospital or clinic">
                            </div>

                            <!-- Anesthesia Type -->
                            <div class="mb-4">
                                <label for="anesthesia" class="block text-sm font-medium text-gray-700 mb-1">Anesthesia Type</label>
                                <select id="anesthesia" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    <option value="">Select type</option>
                                    <option value="general">General</option>
                                    <option value="regional">Regional</option>
                                    <option value="local">Local</option>
                                    <option value="sedation">Conscious Sedation</option>
                                    <option value="none">None</option>
                                    <option value="unknown">Unknown</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Complications -->
                    <div class="mb-4">
                        <label for="complications" class="block text-sm font-medium text-gray-700 mb-1">Complications</label>
                        <textarea id="complications" rows="2" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Any surgical complications"></textarea>
                    </div>

                    <!-- Outcome -->
                    <div class="mb-6">
                        <label for="outcome" class="block text-sm font-medium text-gray-700 mb-1">Outcome</label>
                        <div class="grid grid-cols-3 gap-3">
                            <label class="inline-flex items-center">
                                <input type="radio" name="outcome" value="successful" class="h-4 w-4 text-green-600 focus:ring-green-500" checked>
                                <span class="ml-2 text-sm text-gray-700">Successful</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="outcome" value="partial" class="h-4 w-4 text-yellow-500 focus:ring-yellow-500">
                                <span class="ml-2 text-sm text-gray-700">Partially Successful</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="outcome" value="unsuccessful" class="h-4 w-4 text-red-600 focus:ring-red-500">
                                <span class="ml-2 text-sm text-gray-700">Unsuccessful</span>
                            </label>
                        </div>
                    </div>

                    <!-- Additional Notes -->
                    <div class="mb-6">
                        <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Additional Notes</label>
                        <textarea id="notes" rows="3" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Post-op care, recovery details, etc."></textarea>
                    </div>

                    <!-- Form Actions -->
                    <div class="flex justify-end space-x-3">
                        <button type="button" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            Cancel
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                            Save Surgical Record
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
