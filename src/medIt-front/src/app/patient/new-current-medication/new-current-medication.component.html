<div #newcurrentMedication id="modalEl" tabindex="-1" aria-hidden="true"
  class="fixed left-0 right-0 top-0 z-50 hidden h-[calc(100%-1rem)] max-h-full w-full overflow-y-auto overflow-x-hidden p-4 md:inset-0">
  <div class="relative max-h-full w-full max-w-2xl">
    <!-- Modal content -->
    <div class="relative rounded-lg bg-white shadow-sm dark:bg-gray-700">
      <!-- Modal header -->
      <div
        class="flex space-x-2 items-center text-white bg-blue-600  justify-between rounded-t border-b p-2.5 dark:border-gray-600">
        <div>
          <i class="fa-solid fa-tablets"></i>
        </div>
        <div>
          <h3 class="text-xl font-semibold  lg:text-2xl">
            Current Medication
          </h3>
        </div>
        <button type="button" (click)="closeModal()"
          class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white">
          <svg class="h-3 w-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      <!-- Modal body -->
      <div class="space-y-6 p-5">

        <!-- Form Content -->
        <div class="p-6">
          <form>
            <!-- Medication Name -->
            <div class="mb-4">
              <label for="medicationName" class="block text-sm font-medium text-gray-700 mb-1">Medication Name*</label>
              <div class="relative">
                <input type="text" id="medicationName"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="e.g. Lisinopril, Metformin" required>
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                  <i class="fas fa-prescription-bottle-alt text-gray-400"></i>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <!-- Dosage -->
              <div>
                <label for="dosage" class="block text-sm font-medium text-gray-700 mb-1">Dosage*</label>
                <div class="relative">
                  <input type="text" id="dosage"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="e.g. 10 mg" required>
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <i class="fas fa-weight text-gray-400"></i>
                  </div>
                </div>
              </div>

              <!-- Frequency -->
              <div>
                <label for="frequency" class="block text-sm font-medium text-gray-700 mb-1">Frequency*</label>
                <select id="frequency"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  required>
                  <option value="">Select frequency</option>
                  <option value="once_daily">Once daily</option>
                  <option value="twice_daily">Twice daily</option>
                  <option value="three_times">Three times daily</option>
                  <option value="four_times">Four times daily</option>
                  <option value="every_other_day">Every other day</option>
                  <option value="weekly">Weekly</option>
                  <option value="as_needed">As needed</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <!-- Route -->
              <div>
                <label for="route" class="block text-sm font-medium text-gray-700 mb-1">Route*</label>
                <select id="route"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  required>
                  <option value="">Select route</option>
                  <option value="oral">Oral</option>
                  <option value="topical">Topical</option>
                  <option value="inhalation">Inhalation</option>
                  <option value="injection">Injection</option>
                  <option value="sublingual">Sublingual</option>
                  <option value="rectal">Rectal</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <!-- Prescription Date -->
              <div>
                <label for="prescriptionDate" class="block text-sm font-medium text-gray-700 mb-1">Prescription
                  Date*</label>
                <div class="relative">
                  <input type="date" id="prescriptionDate"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    required>
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <i class="fas fa-calendar-alt text-gray-400"></i>
                  </div>
                </div>
              </div>
            </div>

            <!-- Prescribing Physician -->
            <div class="mb-4">
              <label for="physician" class="block text-sm font-medium text-gray-700 mb-1">Prescribing Physician</label>
              <input type="text" id="physician"
                class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="Dr. Smith">
            </div>

            <!-- Reason for Medication -->
            <div class="mb-4">
              <label for="reason" class="block text-sm font-medium text-gray-700 mb-1">Reason for Medication</label>
              <input type="text" id="reason"
                class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="e.g. Hypertension, Diabetes">
            </div>

            <!-- Instructions -->
            <div class="mb-6">
              <label for="instructions" class="block text-sm font-medium text-gray-700 mb-1">Special
                Instructions</label>
              <textarea id="instructions" rows="3"
                class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="Take with food, Avoid alcohol, etc."></textarea>
            </div>

            <!-- Current Status -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2">Current Status*</label>
              <div class="grid grid-cols-3 gap-3">
                <label class="inline-flex items-center">
                  <input type="radio" name="status" value="active" class="h-4 w-4 text-blue-600 focus:ring-blue-500"
                    checked>
                  <span class="ml-2 text-sm text-gray-700">Active</span>
                </label>
                <label class="inline-flex items-center">
                  <input type="radio" name="status" value="discontinued"
                    class="h-4 w-4 text-gray-600 focus:ring-gray-500">
                  <span class="ml-2 text-sm text-gray-700">Discontinued</span>
                </label>
                <label class="inline-flex items-center">
                  <input type="radio" name="status" value="completed"
                    class="h-4 w-4 text-green-600 focus:ring-green-500">
                  <span class="ml-2 text-sm text-gray-700">Completed</span>
                </label>
              </div>
            </div>
            <hr class="my-4 border-gray-300 dark:border-gray-600" />
            <!-- Form Actions -->

            <div class="flex justify-end space-x-3">
              <button type="button"
                class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Cancel
              </button>
              <button type="submit"
                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Save Medication
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
