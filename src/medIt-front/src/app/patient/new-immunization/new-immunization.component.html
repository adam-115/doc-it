<div #newImmunization id="modalEl" tabindex="-1" aria-hidden="true"
  class="fixed left-0 right-0 top-0 z-50 hidden h-[calc(100%-1rem)] max-h-full w-full overflow-y-auto overflow-x-hidden p-4 md:inset-0">
  <div class="relative max-h-full w-full max-w-2xl">
    <!-- Modal content -->
    <div class="relative rounded-lg bg-white shadow-sm dark:bg-gray-700">
      <!-- Modal header -->
      <div
        class="flex space-x-2 items-center text-white bg-blue-600  justify-between rounded-t border-b p-2.5 dark:border-gray-600">
        <div>
          <i class="fas fa-xl fa-syringe"></i>
        </div>
        <div>
          <h3 class="text-xl font-semibold  lg:text-2xl">
            Immunization
          </h3>
        </div>
        <button type="button" (click)="closeModal()"
          class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white">
          <svg class="h-3 w-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      <!-- Modal body -->
      <div class="space-y-6 p-5">


        <form>
          <!-- Vaccine Name -->
          <div class="mb-4">
            <label for="vaccineName" class="block text-sm font-medium text-gray-700 mb-1">Vaccine Name*</label>
            <div class="relative">
              <input type="text" id="vaccineName"
                class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="e.g. Influenza, MMR" required>
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                <i class="fas fa-syringe text-gray-400"></i>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <!-- Administration Date -->
            <div>
              <label for="adminDate" class="block text-sm font-medium text-gray-700 mb-1">Date Administered*</label>
              <div class="relative">
                <input type="date" id="adminDate"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  required>
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                  <i class="fas fa-calendar-alt text-gray-400"></i>
                </div>
              </div>
            </div>

            <!-- Next Due Date -->
            <div>
              <label for="nextDate" class="block text-sm font-medium text-gray-700 mb-1">Next Due Date</label>
              <div class="relative">
                <input type="date" id="nextDate"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                  <i class="fas fa-calendar-check text-gray-400"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- Vaccine Type -->
          <div class="mb-4">
            <label for="vaccineType" class="block text-sm font-medium text-gray-700 mb-1">Vaccine Type*</label>
            <select id="vaccineType"
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              required>
              <option value="">Select type</option>
              <option value="routine">Routine Immunization</option>
              <option value="travel">Travel Vaccine</option>
              <option value="seasonal">Seasonal (e.g. Flu)</option>
              <option value="booster">Booster Shot</option>
              <option value="other">Other</option>
            </select>
          </div>

          <!-- CVX Code -->
          <div class="mb-4">
            <label for="cvxCode" class="block text-sm font-medium text-gray-700 mb-1">CVX Code</label>
            <div class="relative">
              <input type="text" id="cvxCode"
                class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="Standard vaccine code">
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                <i class="fas fa-code text-gray-400"></i>
              </div>
            </div>
          </div>

          <!-- Administered By -->
          <div class="mb-4">
            <label for="adminBy" class="block text-sm font-medium text-gray-700 mb-1">Administered By</label>
            <input type="text" id="adminBy"
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Provider name or facility">
          </div>

          <!-- Lot Number -->
          <div class="mb-4">
            <label for="lotNumber" class="block text-sm font-medium text-gray-700 mb-1">Lot Number</label>
            <input type="text" id="lotNumber"
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Vaccine lot number">
          </div>

          <!-- Manufacturer -->
          <div class="mb-4">
            <label for="manufacturer" class="block text-sm font-medium text-gray-700 mb-1">Manufacturer</label>
            <input type="text" id="manufacturer"
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Vaccine manufacturer">
          </div>

          <!-- Notes -->
          <div class="mb-6">
            <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
            <textarea id="notes" rows="2"
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Any reactions, special circumstances, etc."></textarea>
          </div>

          <!-- Form Actions -->
          <hr class="my-4 border-gray-300 dark:border-gray-600" />
          <div class="flex justify-end space-x-3">
            <button type="button"
              class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              Cancel
            </button>
            <button type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
              Save Immunization
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
