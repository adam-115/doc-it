<div #newMedicalCondition id="modalEl" tabindex="-1" aria-hidden="true"
  class="fixed left-0 right-0 top-0 z-50 hidden h-[calc(100%-1rem)] max-h-full w-full overflow-y-auto overflow-x-hidden p-4 md:inset-0">
  <div class="relative max-h-full w-full max-w-2xl">
    <!-- Modal content -->
    <div class="relative rounded-lg bg-white shadow-sm dark:bg-gray-700">
      <!-- Modal header -->
      <div
        class="flex space-x-2 items-center text-white bg-blue-600  justify-between rounded-t border-b p-2.5 dark:border-gray-600">
        <div>
          <i class="fas fa-xl fa-syringe"></i>
        </div>
        <div>
          <h3 class="text-xl font-semibold  lg:text-2xl">
            Medical Condition
          </h3>
        </div>
        <button type="button" (click)="closeModal()"
          class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white">
          <svg class="h-3 w-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>

      <!-- Form Content -->
      <div class="p-6">
        <form>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left Column -->
            <div>
              <!-- Condition Name -->
              <div class="mb-4">
                <label for="conditionName" class="block text-sm font-medium text-gray-700 mb-1">Condition Name*</label>
                <div class="relative">
                  <input type="text" id="conditionName"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="e.g. Diabetes, Hypertension" required>
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <i class="fas fa-disease text-gray-400"></i>
                  </div>
                </div>
              </div>

              <!-- Diagnosis Date -->
              <div class="mb-4">
                <label for="diagnosisDate" class="block text-sm font-medium text-gray-700 mb-1">Diagnosis Date*</label>
                <div class="relative">
                  <input type="date" id="diagnosisDate"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    required>
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <i class="fas fa-calendar-alt text-gray-400"></i>
                  </div>
                </div>
              </div>

              <!-- Diagnosing Physician -->
              <div class="mb-4">
                <label for="physician" class="block text-sm font-medium text-gray-700 mb-1">Diagnosing Physician</label>
                <input type="text" id="physician"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Dr. Smith">
              </div>

              <!-- Condition Type -->
              <div class="mb-4">
                <label for="conditionType" class="block text-sm font-medium text-gray-700 mb-1">Condition Type*</label>
                <select id="conditionType"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  required>
                  <option value="">Select type</option>
                  <option value="acute">Acute</option>
                  <option value="chronic">Chronic</option>
                  <option value="congenital">Congenital</option>
                  <option value="hereditary">Hereditary</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>

            <!-- Right Column -->
            <div>
              <!-- Severity -->
              <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Severity*</label>
                <div class="grid grid-cols-3 gap-3">
                  <label class="inline-flex items-center">
                    <input type="radio" name="severity" value="mild" class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700">Mild</span>
                  </label>
                  <label class="inline-flex items-center">
                    <input type="radio" name="severity" value="moderate"
                      class="h-4 w-4 text-yellow-500 focus:ring-yellow-500" checked>
                    <span class="ml-2 text-sm text-gray-700">Moderate</span>
                  </label>
                  <label class="inline-flex items-center">
                    <input type="radio" name="severity" value="severe" class="h-4 w-4 text-red-600 focus:ring-red-500">
                    <span class="ml-2 text-sm text-gray-700">Severe</span>
                  </label>
                </div>
              </div>

              <!-- Current Status -->
              <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Current Status*</label>
                <div class="grid grid-cols-2 gap-3">
                  <label class="inline-flex items-center">
                    <input type="radio" name="status" value="active" class="h-4 w-4 text-blue-600 focus:ring-blue-500"
                      checked>
                    <span class="ml-2 text-sm text-gray-700">Active</span>
                  </label>
                  <label class="inline-flex items-center">
                    <input type="radio" name="status" value="resolved"
                      class="h-4 w-4 text-green-600 focus:ring-green-500">
                    <span class="ml-2 text-sm text-gray-700">Resolved</span>
                  </label>
                  <label class="inline-flex items-center">
                    <input type="radio" name="status" value="managed"
                      class="h-4 w-4 text-purple-600 focus:ring-purple-500">
                    <span class="ml-2 text-sm text-gray-700">Managed</span>
                  </label>
                  <label class="inline-flex items-center">
                    <input type="radio" name="status" value="monitored"
                      class="h-4 w-4 text-cyan-600 focus:ring-cyan-500">
                    <span class="ml-2 text-sm text-gray-700">Monitored</span>
                  </label>
                </div>
              </div>

              <!-- ICD Code -->
              <div class="mb-4">
                <label for="icdCode" class="block text-sm font-medium text-gray-700 mb-1">ICD-10 Code</label>
                <div class="relative">
                  <input type="text" id="icdCode"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="e.g. E11.65">
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <i class="fas fa-barcode text-gray-400"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Description -->
          <div class="mb-4">
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="description" rows="3"
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Describe the condition, symptoms, etc."></textarea>
          </div>

          <!-- Treatment Plan -->
          <div class="mb-6">
            <label for="treatment" class="block text-sm font-medium text-gray-700 mb-1">Treatment Plan</label>
            <textarea id="treatment" rows="3"
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Current treatment approach, medications, therapies, etc."></textarea>
          </div>

          <!-- Form Actions -->
          <div class="flex justify-end space-x-3">
            <button type="button"
              class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              Cancel
            </button>
            <button type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
              Save Condition
            </button>
          </div>
        </form>

        <div
          class="flex items-center space-x-2 rtl:space-x-reverse rounded-b border-t border-gray-200 p-6 dark:border-gray-600">
          <button type="button"
            class="rounded-lg bg-blue-700 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
            I accept
          </button>
          <button type="button"
            class="rounded-lg border border-gray-200 bg-white px-5 py-2.5 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus:z-10 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:border-gray-500 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white">
            Decline
          </button>
        </div>
      </div>
    </div>
  </div>
