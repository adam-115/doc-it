<div #newVitalStatistic id="modalEl" tabindex="-1" aria-hidden="true"
  class="fixed left-0 right-0 top-0 z-50 hidden h-[calc(100%-1rem)] max-h-full w-full overflow-y-auto overflow-x-hidden p-4 md:inset-0">
  <div class="relative max-h-full w-full max-w-2xl">
    <!-- Modal content -->
    <div class="relative rounded-lg bg-white shadow-sm dark:bg-gray-700">
      <!-- Modal header -->
      <div
        class="flex space-x-2 items-center text-white bg-blue-600  justify-between rounded-t border-b p-2.5 dark:border-gray-600">
        <div>
          <i class="fas fa-xl fa-heart-pulse"></i>
        </div>
        <div>
          <h3 class="text-xl font-semibold  lg:text-2xl">
            Record Vital Signs
          </h3>
        </div>
        <button type="button" (click)="closeModal()"
          class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white">
          <svg class="h-3 w-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      <!-- Modal body -->
      <div class="space-y-6 p-5">

        <!-- Form Content -->
        <div class="p-6">
          <form>
            <!-- Date/Time -->
            <div class="mb-4">
              <label for="recordDateTime" class="block text-sm font-medium text-gray-700 mb-1">Date & Time*</label>
              <div class="relative">
                <input type="datetime-local" id="recordDateTime"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  required>
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                  <i class="fas fa-clock text-gray-400"></i>
                </div>
              </div>
            </div>

            <!-- Blood Pressure -->
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Blood Pressure</label>
              <div class="grid grid-cols-3 gap-2">
                <div class="relative">
                  <input type="number" id="systolic" min="40" max="300"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Systolic">
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <span class="text-xs text-gray-400">mmHg</span>
                  </div>
                </div>
                <div class="flex items-center justify-center">
                  <span class="text-gray-400">/</span>
                </div>
                <div class="relative">
                  <input type="number" id="diastolic" min="20" max="200"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Diastolic">
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <span class="text-xs text-gray-400">mmHg</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <!-- Heart Rate -->
              <div>
                <label for="heartRate" class="block text-sm font-medium text-gray-700 mb-1">Heart Rate</label>
                <div class="relative">
                  <input type="number" id="heartRate" min="20" max="250"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="BPM">
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <i class="fas fa-heartbeat text-gray-400"></i>
                  </div>
                </div>
              </div>

              <!-- Respiratory Rate -->
              <div>
                <label for="respiratoryRate" class="block text-sm font-medium text-gray-700 mb-1">Respiratory
                  Rate</label>
                <div class="relative">
                  <input type="number" id="respiratoryRate" min="5" max="60"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Breaths/min">
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <i class="fas fa-lungs text-gray-400"></i>
                  </div>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <!-- Temperature -->
              <div>
                <label for="temperature" class="block text-sm font-medium text-gray-700 mb-1">Temperature</label>
                <div class="relative">
                  <input type="number" id="temperature" min="30" max="43" step="0.1"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="°C">
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <span class="text-gray-400">°C</span>
                  </div>
                </div>
              </div>

              <!-- Oxygen Saturation -->
              <div>
                <label for="oxygenSaturation" class="block text-sm font-medium text-gray-700 mb-1">SpO₂</label>
                <div class="relative">
                  <input type="number" id="oxygenSaturation" min="50" max="100"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="%">
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <span class="text-gray-400">%</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <!-- Height -->
              <div>
                <label for="height" class="block text-sm font-medium text-gray-700 mb-1">Height</label>
                <div class="relative">
                  <input type="number" id="height" min="30" max="250" step="0.1"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="cm">
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <span class="text-gray-400">cm</span>
                  </div>
                </div>
              </div>

              <!-- Weight -->
              <div>
                <label for="weight" class="block text-sm font-medium text-gray-700 mb-1">Weight</label>
                <div class="relative">
                  <input type="number" id="weight" min="1" max="300" step="0.1"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="kg">
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                    <span class="text-gray-400">kg</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- BMI Calculation -->
            <div class="mb-4 bg-blue-50 p-3 rounded-lg">
              <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-gray-700">BMI</span>
                <span id="bmiResult" class="text-lg font-bold text-blue-700">--</span>
              </div>
              <div id="bmiCategory" class="text-xs text-gray-500 mt-1">Enter height and weight to calculate</div>
            </div>

            <!-- Notes -->
            <div class="mb-6">
              <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
              <textarea id="notes" rows="2"
                class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="Any additional observations"></textarea>
            </div>
               <hr class="my-4 border-gray-300 dark:border-gray-600" />
            <!-- Form Actions -->
            <div class="flex justify-end space-x-3">
              <button type="button"
                class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Cancel
              </button>
              <button type="submit"
                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Save Vitals
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
