<div #newAllergy id="modalEl" tabindex="-1" aria-hidden="true"
  class="fixed left-0 right-0 top-0 z-50 hidden h-[calc(100%-1rem)] max-h-full w-full overflow-y-auto overflow-x-hidden p-4 md:inset-0">
  <div class="relative max-h-full w-full max-w-2xl">
    <!-- Modal content -->
    <div class="relative rounded-lg bg-white shadow-sm dark:bg-gray-700">
      <!-- Modal header -->
      <div
        class="flex space-x-4 items-center text-white bg-blue-600  justify-between rounded-t border-b p-2.5 dark:border-gray-600">
        <div>
          <i class="fas fa-xl fa-allergies"></i>
        </div>
        <div>
          <h3 class="text-xl font-semibold  lg:text-2xl">
            New Allergy
          </h3>
        </div>
        <button type="button" (click)="closeModal()"
          class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white">
          <svg class="h-3 w-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      <!-- Modal body -->
      <div class="space-y-6 p-5">
        <form>
          <!-- Allergy Name -->
          <div class="mb-4">
            <label for="allergyName" class="block text-sm font-medium text-gray-700 mb-1">Allergy Name*</label>
            <div class="relative">
              <input type="text" id="allergyName"
                class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="e.g. Penicillin, Peanuts" required>
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                <i class="fas fa-pills text-gray-400"></i>
              </div>
            </div>
          </div>

          <!-- Reaction Type -->
          <div class="mb-4">
            <label for="reactionType" class="block text-sm font-medium text-gray-700 mb-1">Reaction Type*</label>
            <select id="reactionType"
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              required>
              <option value="">Select reaction type</option>
              <option value="anaphylaxis">Anaphylaxis</option>
              <option value="rash">Rash/Hives</option>
              <option value="swelling">Swelling</option>
              <option value="respiratory">Respiratory distress</option>
              <option value="gi">GI symptoms</option>
              <option value="other">Other</option>
            </select>
          </div>

          <!-- Severity -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Severity*</label>
            <div class="grid grid-cols-3 gap-3">
              <label class="inline-flex items-center">
                <input type="radio" name="severity" value="mild" class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                <span class="ml-2 text-sm text-gray-700">Mild</span>
              </label>
              <label class="inline-flex items-center">
                <input type="radio" name="severity" value="moderate"
                  class="h-4 w-4 text-yellow-500 focus:ring-yellow-500" checked>
                <span class="ml-2 text-sm text-gray-700">Moderate</span>
              </label>
              <label class="inline-flex items-center">
                <input type="radio" name="severity" value="severe" class="h-4 w-4 text-red-600 focus:ring-red-500">
                <span class="ml-2 text-sm text-gray-700">Severe</span>
              </label>
            </div>
          </div>

          <!-- Onset Date -->
          <div class="mb-4">
            <label for="onsetDate" class="block text-sm font-medium text-gray-700 mb-1">Onset Date</label>
            <div class="relative">
              <input type="date" id="onsetDate"
                class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                <i class="fas fa-calendar-alt text-gray-400"></i>
              </div>
            </div>
          </div>

          <!-- Notes -->
          <div class="mb-6">
            <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Additional Notes</label>
            <textarea id="notes" rows="3"
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Describe the reaction in detail, treatment given, etc."></textarea>
          </div>

          <!-- Current Status -->
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Current Status</label>
            <div class="grid grid-cols-2 gap-3">
              <label class="inline-flex items-center">
                <input type="radio" name="status" value="active" class="h-4 w-4 text-blue-600 focus:ring-blue-500"
                  checked>
                <span class="ml-2 text-sm text-gray-700">Active</span>
              </label>
              <label class="inline-flex items-center">
                <input type="radio" name="status" value="resolved" class="h-4 w-4 text-green-600 focus:ring-green-500">
                <span class="ml-2 text-sm text-gray-700">Resolved</span>
              </label>
            </div>
          </div>
           <hr class="my-4 border-gray-300 dark:border-gray-600" />
          <!-- Form Actions -->
          <div class="flex justify-end space-x-3">
            <button type="button"
              class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
              Cancel
            </button>
            <button type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
