<div style="display: grid; grid-template-columns:1fr;" class="overflow-hidden bg-green-50 gap-0 mt-2">
  @for (item of timesPeriods; track $index) {
  <div (dblclick)="addNewAppointment(item)" class="relative h-10 border text-center" [style.gridColumnStart]="1"
    [style.gridColumnEnd]="2" [style.gridRowStart]="item.rowStart" [style.gridRowEnd]="item.rowEnd">
    <!-- {{item.rowStart}}-{{item.rowEnd}} -->
    <!-- {{dayDate | date:'dd MMMM yyyy'}} -->
    <div class="absolute top-0 hover:cursor-pointer right-0 w-3 h-10 max-h-10 ">
      <div (click)="addNewAppointment(item)"
        class="flex justify-center align-middle text-center h-5 bg-gray-50 opacity-30 hover:bg-gray-500  hover:opacity-90 ">
        +
      </div>
      <div (click)="displayAppointmentInTop(item)"
        class="h-5 flex justify-center align-middle text-center bg-gray-50 opacity-30 hover:bg-gray-500  hover:opacity-90 ">
        *
      </div>
    </div>
  </div>
  }

  @for (item of currentDayAppointment; track $index) {
  <div (mouseenter)="mouseHoverZindexChange($event,item)" (mouseleave)="mouseLeaveZindexChange($event,item)"
    class=" bg-red-300 flex m-0.5  overflow-hidden border border-gray-600 rounded z-1  opacity-80 col-start-1 col-end-2"
    [style.gridColumnStart]="1" [style.gridColumnEnd]="2" [style.gridRowStart]="item.timePeriod.rowStart"
    [style.gridRowEnd]="item.timePeriod.rowEnd"
    [style]="calculateWidth(item)+';'+calculateMarginLeft(item)+';background-color:'+item.color+';z-index:'+item.zIndex">
    <!-- {{item.zIndex}} -->
    <!-- {{item.timePeriod.timeStart}} - {{item.timePeriod.timeEnd}} -->
    <!-- {{item.date| date:'dd MMMM yyyy'}} - {{item.timePeriod.timeStart}} - {{item.timePeriod.timeEnd}} -->
    <!-- {{dayDate| date:'dd MMMM yyyy'}} -->
  </div>
  }

</div>
<!-- </div> -->

<!-- Dialog  -->
<div #newAppointment id="modalEl" tabindex="-1" aria-hidden="true"
  class="fixed left-0 right-0 top-0 z-50 hidden h-[calc(100%-1rem)] max-h-full w-full overflow-y-auto overflow-x-hidden p-4 md:inset-0">
  <div class="relative max-h-full w-full max-w-2xl">
    <!-- Modal content -->
    <div class="relative rounded-lg bg-white shadow-sm dark:bg-gray-700">
      <!-- Modal header -->
      <div
        class="flex space-x-2 items-center text-white bg-blue-600  justify-between rounded-t border-b p-2.5 dark:border-gray-600">
        <div>
          <i class="fas fa-xl fa-heart-pulse"></i>
        </div>
        <div>
          <h3 class="text-xl font-semibold  lg:text-2xl">
            New Appointment
          </h3>
        </div>
        <button type="button" (click)="hideModal() "
          class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white">
          <svg class="h-3 w-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      <!-- Modal body -->
      <!-- Form Content -->
      <div class="p-6">

        <!-- Patient Information -->
        <div class="mb-4">
          <label for="patient" class="block text-gray-700 font-medium mb-2">Patient</label>
          <select id="patient"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Select patient...</option>
            <option value="1001">John Smith (MRN: 1001)</option>
            <option value="1002">Maria Garcia (MRN: 1002)</option>
            <option value="1003">David Lee (MRN: 1003)</option>
          </select>
        </div>

        <!-- Date Selection -->
        <div class="mb-4">
          <label class="block text-gray-700 font-medium mb-2">Appointment Date</label>
          <input type="date"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            min="">
        </div>
        <div class="mb-4 flex">
          <label class=" text-gray-700 font-medium mb-2" for="myColor">Choose a color:</label>
          <input type="color" [(ngModel)]="selectedColor"
            class="ml-2 w-10 h-6 border border-gray-300 cursor-pointer rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            id="myColor">
        </div>

        <!-- Time Selection -->
        <div class="mb-4">
          <label class="block text-gray-700 font-medium mb-2">Appointment Time Start</label>
          <div class="flex gap-2">
            <!-- Hour Select -->
            <div class="flex-1">
              <select id="appointmentHour" [(ngModel)]="hourStart"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="06">06</option>
                <option value="07">07</option>
                <option value="08">08</option>
                <option value="09">09 </option>
                <option value="10">10 </option>
                <option value="11">11 </option>
                <option value="12">12 </option>
                <option value="13">13 </option>
                <option value="14">14 </option>
                <option value="15">15 </option>
                <option value="16">16 </option>
                <option value="17">17 </option>
                <option value="18">18 </option>
                <option value="19">19 </option>
                <option value="20">20 </option>
                <option value="21">21 </option>
              </select>
            </div>

            <!-- Minute Select -->
            <div class="flex-1">
              <select id="appointmentMinute" [(ngModel)]="minuteStart"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Minute</option>
                <option value="00">00</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="45">45</option>
              </select>
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 font-medium mb-2">Appointment Time End</label>
          <div class="flex gap-2">
            <!-- Hour Select -->
            <div class="flex-1">
              <select id="appointmentHour" [(ngModel)]="hourEnd"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="06">06</option>
                <option value="07">07</option>
                <option value="08">08</option>
                <option value="09">09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
              </select>
            </div>

            <!-- Minute Select -->
            <div class="flex-1">
              <select id="appointmentMinute" [(ngModel)]="minuteEnd"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Minute</option>
                <option value="00">00</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="45">45</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Appointment Details -->
        <div class="mb-4">
          <label for="appointmentType" class="block text-gray-700 font-medium mb-2">Appointment Type</label>
          <select id="appointmentType"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="checkup">General Checkup</option>
            <option value="followup">Follow-up Visit</option>
            <option value="vaccination">Vaccination</option>
            <option value="procedure">Medical Procedure</option>
            <option value="consultation">Specialist Consultation</option>
          </select>
        </div>

        <!-- Description Field -->
        <div class="mb-6">
          <label for="description" class="block text-gray-700 font-medium mb-2">Description</label>
          <textarea id="description" rows="3"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter appointment details, symptoms, or special instructions..."></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-3">
          <button type="button" (click)="hideModal()"
            class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
            Cancel
          </button>
          <button type="submit" (click)="addAppointement()"
            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
            Schedule Appointment
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
